# Used only by the real AWS deploy (see .github/workflows/deploy-aws.yml),
# which is why it lives in k8s/aws/ alongside secret-aws.yaml.example
# rather than k8s/03-app/.
apiVersion: v1
kind: Service
metadata:
  name: workshop-app
  namespace: workshop
  annotations:
    # Without this, EKS's legacy in-tree AWS cloud provider defaults to
    # a Classic Load Balancer instead of an NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: workshop-app
  ports:
    - port: 80
      targetPort: 8080
