# Used only by the real AWS deploy (see .github/workflows/deploy-aws.yml).
# The kind-based local/CI pipeline keeps using service.yaml (NodePort) —
# kind has no cloud load balancer controller to satisfy this type.
apiVersion: v1
kind: Service
metadata:
  name: workshop-app
  namespace: workshop
  annotations:
    # Without this, EKS's legacy in-tree AWS cloud provider defaults to
    # a Classic Load Balancer instead of an NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: workshop-app
  ports:
    - port: 80
      targetPort: 8080
