name: Deploy to AWS (EKS + RDS)

# workflow_dispatch permanently, by design — not a stopgap. The EKS
# cluster (Repo 2) and RDS (Repo 3) aren't always up (destroyed between
# AWS Academy sessions to save budget), so this can't run on every
# push. The deploy itself is automatic end-to-end once triggered, with
# no manual steps during the run — only the trigger is manual, fired
# whenever convenient and the Lab session is active.
# Tested successfully end-to-end on 2026-09-15. This is now the only
# deploy path — the kind-based deploy-hml/deploy-prod jobs that used to
# live in ci-cd.yml (a free pre-validation path independent of the AWS
# Lab session, used during development) were removed once this path was
# validated. See ADR 0014.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy the app, or tear it down (delete the Service first, releasing the NLB, before Repo 2/3 are destroyed)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
      environment:
        description: 'Target environment'
        required: true
        default: 'homologacao'
        type: choice
        options:
          - homologacao
          - producao

jobs:
  deploy:
    name: Deploy to EKS
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: tech-challenge-eks
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for the EKS cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply namespace and app config
        run: |
          kubectl apply -f k8s/00-namespace/namespace.yaml
          kubectl apply -f k8s/01-config/app-configmap.yaml

      - name: Create/update app secret (RDS connection, JWT, webhook, New Relic)
        run: |
          kubectl create secret generic app-secret \
            --namespace workshop \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=WEBHOOK_TOKEN="${{ secrets.WEBHOOK_TOKEN }}" \
            --from-literal=SPRING_DATASOURCE_URL="${{ secrets.RDS_DATASOURCE_URL }}" \
            --from-literal=SPRING_DATASOURCE_USERNAME="${{ secrets.RDS_USERNAME }}" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.RDS_PASSWORD }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update Docker Hub image pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --namespace workshop \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # No mysql-config/mysql-secret step here — the database is the RDS
      # instance from Repo 3, not a pod in this cluster. k8s/aws/ holds the
      # manifests specific to this path (e.g. the LoadBalancer Service).
      - name: Deploy app
        run: |
          kubectl apply -f k8s/03-app/deployment.yaml
          kubectl apply -f k8s/03-app/hpa.yaml
          kubectl apply -f k8s/aws/service-loadbalancer.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/workshop-app -n workshop --timeout=300s

      - name: Wait for LoadBalancer hostname
        id: lb
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc workshop-app -n workshop -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "host=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for LoadBalancer hostname" >&2
          exit 1

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${{ steps.lb.outputs.host }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "App is UP"
              exit 0
            fi
            sleep 10
          done
          echo "App did not become healthy in time" >&2
          exit 1

  destroy:
    name: Tear down app from EKS
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: tech-challenge-eks
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for the EKS cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      # Deleting the Service first (not just the Deployment) is the whole
      # point: it's what tells the AWS cloud-controller to release the NLB.
      # Do this before destroying Repo 2/3's Terraform, or the NLB (and its
      # hourly cost) can be orphaned with no cluster left to clean it up.
      - name: Delete app resources
        run: |
          kubectl delete -f k8s/aws/service-loadbalancer.yaml --ignore-not-found
          kubectl delete -f k8s/03-app/hpa.yaml --ignore-not-found
          kubectl delete -f k8s/03-app/deployment.yaml --ignore-not-found
          kubectl delete secret app-secret dockerhub-secret -n workshop --ignore-not-found

      - name: Wait for the NLB to be released
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc workshop-app -n workshop -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$HOST" ]; then
              echo "LoadBalancer released (or Service already gone)."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the LoadBalancer to be released — check the AWS console before destroying Repo 2/3." >&2
          exit 1
