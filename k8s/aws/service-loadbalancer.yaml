# Used only by the real AWS deploy (see .github/workflows/deploy-aws.yml).
# The kind-based local/CI pipeline keeps using k8s/03-app/service.yaml
# (NodePort) — kind has no cloud load balancer controller to satisfy
# this type. Lives in k8s/aws/, not k8s/03-app/, on purpose: infra/manifests.tf
# applies every *.yaml under 03-app/ for the kind path, and a second
# Service named "workshop-app" there breaks that apply with
# "resource already exists".
apiVersion: v1
kind: Service
metadata:
  name: workshop-app
  namespace: workshop
  annotations:
    # Without this, EKS's legacy in-tree AWS cloud provider defaults to
    # a Classic Load Balancer instead of an NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: workshop-app
  ports:
    - port: 80
      targetPort: 8080
