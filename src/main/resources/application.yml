spring:
  application:
    name: workshop-management

  datasource:
    url: jdbc:mysql://localhost:3306/workshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: workshop
    password: workshop123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Placeholder credentials for development — replaced with JWT in Phase 5
  security:
    user:
      name: dev
      password: dev

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-64-characters-long-for-hs512}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fiap.workshop: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
