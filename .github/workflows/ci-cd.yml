name: Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn verify
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  build-and-push-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            adrianameyer/workshop-management:latest
            adrianameyer/workshop-management:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-hml:
    name: Deploy — Homologação
    needs: build-and-push-image
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      environment-name: homologacao
    secrets: inherit

  deploy-prod:
    name: Deploy — Produção
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      environment-name: producao
    secrets: inherit
